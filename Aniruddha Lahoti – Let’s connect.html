<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aniruddha Lahoti – Let’s connect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Poppins:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121211; --card:#171715; --line:#2d2d29; --text:#F5F3EC; --muted:#BDB9AD;
  --yellow:#F0F43A; --purple:#A78BFA; --ink:#111;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#121211; --card:#171715; } }
:root[data-theme="dark"]{ --bg:#121211; --card:#171715; }
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;min-height:100%;overflow-x:hidden;background:var(--bg);color:var(--text);
  font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
.wrap{max-width:480px;margin:0 auto;padding:18px 20px 44px;text-align:center}

/* top chip */
.chip{
  display:inline-flex;align-items:center;gap:8px;padding:4px 14px 4px 4px;border-radius:999px;
  background:#1b1b18;border:1px solid var(--line);font-size:13px;font-weight:500;
  animation:rise .6s both;
}
.chip b{background:var(--yellow);color:var(--ink);border-radius:999px;padding:3px 10px;font-weight:600}
.chip i{font-style:normal;min-width:6.5em;text-align:left}
.chip i::after{content:"";display:inline-block;width:2px;height:1em;margin-left:2px;background:var(--yellow);vertical-align:-2px;animation:blink 1s steps(2) infinite}
.chip.done i::after{display:none}

/* headline */
.head{display:block;width:100%;height:auto;margin:16px 0 0}
.head text{fill:var(--text);stroke:var(--text);stroke-width:2.5px;stroke-linejoin:round;font-family:'Archivo Black',Impact,'Arial Black',sans-serif;font-size:100px}
.head .l1{animation:rise .7s .15s both}
.head .l2{animation:rise .7s .3s both}
.roles{display:flex;flex-wrap:wrap;justify-content:center;gap:7px;margin:14px 0 0}
.roles span{padding:5px 12px;border:1px solid var(--line);border-radius:999px;background:#1b1b18;color:var(--muted);font-size:12.5px;font-weight:500;animation:rise .5s calc(.5s + var(--i)*.07s) both}

/* hero card */
.card{
  position:relative;margin-top:22px;border:1px solid var(--line);border-radius:20px;background:var(--card);
  overflow:hidden;line-height:0;animation:rise .7s .4s both;
}
.card svg{display:block;width:100%;height:auto}
.shape{transform-origin:50% 100%;animation:pop .8s .6s cubic-bezier(.2,.9,.3,1.25) both}
.who{animation:float 5s 1.4s ease-in-out infinite}
.glow line{stroke:var(--yellow);stroke-linecap:round}
.glow .g{stroke-width:22;opacity:.16}
.glow .c{stroke-width:7}
.glow .burst{animation:flick 2.4s ease-in-out infinite}
.glow .burst:nth-of-type(2){animation-delay:.6s}
.wave{
  position:absolute;right:6%;top:9%;width:54px;height:54px;border-radius:50%;line-height:1;
  background:var(--yellow);border:3px solid var(--ink);display:grid;place-items:center;font-size:27px;
  box-shadow:3px 4px 0 var(--ink);animation:pop .5s 1.1s both, bob 2.4s 1.6s ease-in-out infinite;
}
.wave span{display:inline-block;transform-origin:70% 70%;animation:waving 2.2s 1.6s ease-in-out infinite}

/* links */
.links{list-style:none;margin:26px 0 0;padding:0;display:grid;gap:12px}
.links li{opacity:0;animation:slide .6s calc(1.2s + var(--i)*.1s) cubic-bezier(.2,.9,.3,1.2) forwards}
.btn{
  display:flex;align-items:center;gap:10px;min-height:62px;padding:8px 9px 8px 9px;border-radius:999px;
  color:var(--text);text-decoration:none;font-weight:600;font-size:17px;background:#1b1b18;border:1px solid #3a3a34;
  transition:transform .25s cubic-bezier(.2,.9,.3,1.5),background .2s,border-color .2s;
}
.btn:hover,.btn:focus-visible{transform:translateY(-3px) scale(1.02);border-color:var(--yellow);outline:none}
.btn:active{transform:scale(.96)}
.btn.main{background:var(--yellow);color:var(--ink);border-color:var(--yellow)}
.ic{
  flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--c);
  font-weight:900;font-size:18px;font-family:'Archivo Black',Arial,sans-serif;
}
.ic svg{width:24px;height:24px}
.lbl{flex:1;text-align:center}
.arr{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--yellow);color:var(--ink);transition:transform .25s}
.btn.main .arr{background:var(--ink);color:var(--yellow)}
.arr svg{width:20px;height:20px}
.btn:hover .arr{transform:rotate(-45deg)}

/* qr */
.foot{margin-top:30px;color:var(--muted);font-size:14px}
.qrbtn{
  margin-top:12px;font:inherit;font-weight:600;color:var(--text);background:transparent;border:1px solid #3a3a34;
  border-radius:999px;padding:10px 22px;cursor:pointer;transition:transform .2s cubic-bezier(.2,.9,.3,1.5),border-color .2s;
}
.qrbtn:hover{border-color:var(--yellow)}
.qrbtn:active{transform:scale(.95)}
.qrcard{display:none;margin:16px auto 0;width:max-content;max-width:100%;background:#fff;padding:14px;border-radius:20px;animation:pop .4s both}
.qrcard.open{display:block}
.qrcard #qr{display:grid;place-items:center}
.qrcard p{margin:8px 0 0;color:var(--ink);font-weight:600;font-size:13px}

@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:scale(1)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-6px) rotate(6deg)}}
@keyframes waving{0%,60%,100%{transform:rotate(0)}10%,30%{transform:rotate(18deg)}20%,40%{transform:rotate(-14deg)}50%{transform:rotate(10deg)}}
@keyframes flick{0%,100%{opacity:1}45%{opacity:.35}55%{opacity:1}}
@keyframes blink{50%{opacity:0}}
@keyframes slide{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;animation-delay:0s!important}
  .links li{opacity:1}
}
</style>
</head>
